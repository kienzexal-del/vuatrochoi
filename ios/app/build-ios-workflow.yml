name: Build iOS IPA (Vua Tro Choi)

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios/app
          xcodegen generate

      - name: Build and Package IPA
        run: |
          cd ios/app
          # Archive app without code signing
          xcodebuild archive \
            -project VuaTroChoi.xcodeproj \
            -scheme VuaTroChoi \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/VuaTroChoi.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          # Package into .ipa
          mkdir -p build/Payload
          cp -r build/VuaTroChoi.xcarchive/Products/Applications/VuaTroChoi.app build/Payload/
          cd build
          zip -r VuaTroChoi.ipa Payload
          echo "IPA build completed successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VuaTroChoi-iOS-IPA
          path: ios/app/build/VuaTroChoi.ipa
          retention-days: 30
